const PAYWALL = ["valor econômico","jornal do comércio","jornal do comércio - porto alegre"];
const EXCLUIR_CANAL = ["coelho da fonseca","lopes","assuntos de interesse"];

function normalizeEmpresa(canal) {
  const c = String(canal||'').toLowerCase();
  if (c.includes('loft')||c.includes('foxter')) return 'Loft';
  if (c.includes('zap')||c.includes('olx')||c.includes('viva real')) return 'ZAP';
  if (c.includes('quintoandar')||c.includes('quinto andar')||c.includes('imovelweb')) return 'QuintoAndar';
  if (c.includes('superlógica')||c.includes('superlogica')) return 'Superlógica';
  if (c.includes('creditas')) return 'Creditas';
  if (c.includes('porto seguro')) return 'Porto Seguro';
  return canal||'';
}

function excelDateToStr(v) {
  if (!v) return '';
  if (typeof v === 'string' && v.includes('/')) return v;
  const n = parseFloat(v);
  if (isNaN(n)) return String(v);
  const d = new Date((n - 25569) * 86400 * 1000);
  return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()}`;
}

function isTier1(v) { return TIER1.has(String(v||'').toLowerCase().trim()); }
function isPaywall(v) { return PAYWALL.some(p=>String(v||'').toLowerCase().includes(p)); }
function isCanalExcluido(c) { return EXCLUIR_CANAL.some(e=>String(c||'').toLowerCase().includes(e)); }

function isPressReleasePago(titulo, release) {
  const r = String(release||'').toLowerCase();
  const t = String(titulo||'').toLowerCase();
  return r==='sim'||r==='yes'||t.includes('enviado por dino')||t.includes('conteúdo de marca');
}

// ─────────────────────────────────────────────
// ESTADO

const S = {
  apiKey: sessionStorage.getItem('gk')||'',
  file: null, processing: false,
  progress: 0, status: '', results: null,
};

// ─────────────────────────────────────────────
// FETCH COM TIMEOUT
// ─────────────────────────────────────────────
async function fetchWithTimeout(url, ms=12000) {
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), ms);
  try {
    const r = await fetch(url, {signal: ctrl.signal});
    clearTimeout(id);
    return r;
  } catch(e) { clearTimeout(id); throw e; }
}

async function fetchArticleText(url) {
  if (!url||!String(url).startsWith('http')) return '';
  try {
    const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const r = await fetchWithTimeout(proxy, 13000);
    if (!r.ok) return '';
    const html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style,nav,header,footer,aside').forEach(e=>e.remove());
    const txt = Array.from(doc.querySelectorAll('p,h1,h2,h3'))
      .map(p=>p.textContent.trim()).filter(t=>t.length>20).join(' ');
    return txt.slice(0,5000);
  } catch(e) { return ''; }
}

// ─────────────────────────────────────────────
// GEMINI
// ─────────────────────────────────────────────
const TEMAS = ["Mercado Imobiliário","Precificação","Locação","Compra e Venda",
  "Tecnologia e Produto","Porta-voz","Pesquisas e Tendências","Expansão e Negócios",
  "Crise e Reputação","Mercado de Capitais","Urbanismo e Cidades",
  "Financiamento e Crédito","ESG","RH e Cultura","Transações","Crédito Imobiliário"];

async function avaliarGemini(titulo, veiculo, empresa, texto, apiKey) {
  const semTexto = !texto;
  const conteudo = texto || `[Texto não disponível — avalie apenas pelo título: ${titulo}]`;

  const prompt = `Você é especialista em PR Score da Loft (mercado imobiliário brasileiro).
Avalie a matéria e responda APENAS em JSON válido, sem markdown.

EMPRESA: ${empresa}
TÍTULO: ${titulo}
VEÍCULO: ${veiculo}
TEXTO: ${conteudo}

LÓGICA OBRIGATÓRIA:
Passo 1 — Se algum critério 9-19 for verdadeiro → DESTAQUE. Senão → MENÇÃO (exceto se C1 ou C2 forem verdadeiros).
C9: ≥3 frases de porta-voz
C10: ≥5 frases ou 8 linhas sobre a empresa
C11: empresa ocupa ≥30% do texto
C12: live 1k+ views [HUMANO]
C13: empresa é fonte de dados (mais comum)
C14: citação em coluna jornalística
C15: veículo nichado estratégico [HUMANO]
C16: sentenças positivas/negativas alternadas
C17: publieditorial disfarçado
C18: anúncio governamental com empresa
C19: equivalências (OLX→ZAP, ImovelWeb→QuintoAndar, Foxter→Loft)

Passo 2 (só se Destaque) — pontos extras +1 cada:
C1: empresa no título/linha-fina
C2: foto com executivo/logo [SINALIZAR]
C3: TV/Rádio duração [HUMANO]
C4: TV/Rádio aspas porta-voz [HUMANO]
C5: chamada redes/home portal [HUMANO]
C6: gráfico/infográfico/box [SINALIZAR]
C7: artigo de executivo
C8: 10+ trechos porta-voz no lead [HUMANO]
C20: ≥6 menções à empresa
C21: CTA explícito para outra matéria

Tom negativo → "Destaque Negativo" ou "Menção Negativa".
pr_tec_produto e pr_puro_imobis: apenas Loft, senão false.
Temas disponíveis: ${TEMAS.join(', ')}

JSON esperado:
{"protagonismo":"Destaque|Menção|Destaque Negativo|Menção Negativa","tipo":"Online|Impresso|Rádio|TV|Chamada Online","pr_tec_produto":false,"pr_puro_imobis":false,"data":false,"data_carona":false,"tema":"","subtema":"","produto":"","pontuacao":0,"criterios_considerados":"","necessarios_avaliacao_humana":"","obs":"","confianca":"alta|media|baixa"}`;

  for (let t=0; t<3; t++) {
    try {
      const r = await fetchWithTimeout(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
        20000
      );
      const resp = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
        {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            contents:[{parts:[{text:prompt}]}],
            generationConfig:{temperature:0.1,maxOutputTokens:800}
          })
        }
      );
      if (!resp.ok) { const e=await resp.text(); throw new Error(e.slice(0,200)); }
      const d = await resp.json();
      let raw = d.candidates?.[0]?.content?.parts?.[0]?.text||'';
      raw = raw.replace(/```json\s*/gi,'').replace(/```\s*/gi,'').trim();
      const res = JSON.parse(raw);
      if (semTexto) {
        res.necessarios_avaliacao_humana = [res.necessarios_avaliacao_humana,'SEM_TEXTO'].filter(Boolean).join(';');
        res.confianca = 'baixa';
      }
      return res;
    } catch(e) {
      if (t<2) await new Promise(r=>setTimeout(r, 2000*(t+1)));
      else return {
        protagonismo:'Menção',tipo:'Online',pr_tec_produto:false,pr_puro_imobis:false,
        data:false,data_carona:false,tema:'',subtema:'',produto:'',pontuacao:0,
        criterios_considerados:'',necessarios_avaliacao_humana:'ERRO_GEMINI',
        obs:`🔴 Erro: ${String(e.message||e).slice(0,100)}`,confianca:'baixa'
      };
    }
  }
}

// ─────────────────────────────────────────────
// PROCESSAMENTO
// ─────────────────────────────────────────────
async function processar() {
  if (!S.file||!S.apiKey||S.processing) return;
  S.processing=true; S.progress=0; S.results=null;
  render();

  try {
    upd('Lendo planilha...', 2);
    const buf = await S.file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellStyles:true, cellDates:true});
    const wsName = wb.SheetNames.includes('Matérias') ? 'Matérias' : wb.SheetNames[0];
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wsName], {header:1, defval:''});

    // Headers na linha 4 (índice 3), dados a partir do índice 4
    const dataRows = raw.slice(4).filter(r=>r[0]);

    // Mapear colunas: A=0 título, B=1 veículo, C=2 data, G=6 canal, L=11 estado, M=12 mídia, W=22 release, AB=27 link
    const rows = dataRows.map((r,i)=>({
      _i: i,
      titulo: r[0], veiculo: r[1], data_raw: r[2],
      canal: r[6], estado: r[11], midia: r[12],
      release: r[22], link: r[27]||'',
    }));

    upd('Criando cópia de backup...', 5);

    // ── Aba "Cópia de Matérias" (backup limpo)
    const wbOut = XLSX.utils.book_new();
    const wsCopia = XLSX.utils.aoa_to_sheet(raw);
    XLSX.utils.book_append_sheet(wbOut, wsCopia, 'Cópia de Matérias');

    // ── Aba "Matérias" com linhas pintadas
    upd('Filtrando e pintando linhas...', 8);
    const wsMat = XLSX.utils.aoa_to_sheet(raw);
    const redReasons = [];

    rows.forEach(row => {
      let reason = '';
      if (isCanalExcluido(row.canal)) reason = 'Canal excluído';
      else if (!isTier1(row.veiculo)) reason = 'Não é Tier 1';
      else if (isPressReleasePago(row.titulo, row.release)) reason = 'Press release pago';

      if (reason) {
        redReasons.push({rowData: row, reason});
        const sheetRow = row._i + 4; // +4 porque dados começam no índice 4 do array (linha 5 da planilha)
        for (let c=0; c<=27; c++) {
          const addr = XLSX.utils.encode_cell({r: sheetRow, c});
          if (!wsMat[addr]) wsMat[addr] = {v:'', t:'s'};
          wsMat[addr].s = {fill:{fgColor:{rgb:'FFCCCC'}, patternType:'solid'},
                           font:{color:{rgb:'990000'}}};
        }
      }
    });

    XLSX.utils.book_append_sheet(wbOut, wsMat, 'Matérias');

    // ── Filtrar válidas
    const validas = rows.filter(r => {
      if (isCanalExcluido(r.canal)) return false;
      if (!isTier1(r.veiculo)) return false;
      if (isPressReleasePago(r.titulo, r.release)) return false;
      return true;
    });

    upd(`Avaliando ${validas.length} matérias com IA...`, 12);

    // ── Avaliar com Gemini
    const gabarito = [];
    for (let i=0; i<validas.length; i++) {
      const row = validas[i];
      upd(`Avaliando ${i+1}/${validas.length}: ${String(row.titulo).slice(0,60)}...`,
        12 + Math.round((i/validas.length)*72));

      let texto = '', paywallFlag = false;
      if (isPaywall(row.veiculo)) {
        paywallFlag = true;
      } else {
        texto = await fetchArticleText(row.link);
      }

      const empresa = normalizeEmpresa(row.canal);
      let aval;

      if (paywallFlag) {
        aval = {protagonismo:'Menção',tipo:'Impresso',pr_tec_produto:false,pr_puro_imobis:false,
          data:false,data_carona:false,tema:'',subtema:'',produto:'',pontuacao:0,
          criterios_considerados:'',necessarios_avaliacao_humana:'PAYWALL',
          obs:`🔴 PAYWALL — ${row.veiculo}: acessar com login premium`,confianca:'baixa'};
      } else {
        aval = await avaliarGemini(row.titulo, row.veiculo, empresa, texto, S.apiKey);
        await new Promise(r=>setTimeout(r,600));
      }

      const dataStr = excelDateToStr(row.data_raw);
      const mes = dataStr.split('/')[1]?.replace(/^0/,'')||'';

      gabarito.push({
        indice: i+1, mes, titulo: row.titulo, veiculo: row.veiculo,
        data: dataStr, canal: row.canal, link: row.link, empresa,
        protagonismo: aval.protagonismo, tipo: aval.tipo,
        pr_tec_produto: aval.pr_tec_produto, pr_puro_imobis: aval.pr_puro_imobis,
        data_flag: aval.data, data_carona: aval.data_carona,
        retranca:'', modelo_clipping:`*[Retranca]* ${row.titulo} - ${row.veiculo} ${row.link}`,
        tema: aval.tema, subtema: aval.subtema, produto: aval.produto,
        obs: aval.obs, chave_subscore:`${i+1}${row.veiculo}`,
        cidade:'', estado: row.estado,
        pontuacao: aval.pontuacao, criterios: aval.criterios_considerados,
        humano: aval.necessarios_avaliacao_humana, confianca: aval.confianca,
      });
    }

    upd('Gerando Gabarito Dashboard...', 86);

    const hdrs = ['Índice','Mês','Título','Veículo','Data','Canal','Link','Empresa',
      'Protagonismo','Tipo','PR Tec+Produto','PR Puro Imobis','Data','Data Carona',
      'Retranca','Modelo Clipping','Tema','Subtema','Produto','OBS','Chave Subscore',
      'Cidade','Estado','Pontuação da Matéria','Critérios Considerados na Pontuação',
      'Necessários Avaliação Humana'];

    const gabRows = gabarito.map(g=>[
      g.indice, g.mes, g.titulo, g.veiculo, g.data, g.canal, g.link, g.empresa,
      g.protagonismo, g.tipo, g.pr_tec_produto?'TRUE':'FALSE', g.pr_puro_imobis?'TRUE':'FALSE',
      g.data_flag?'TRUE':'FALSE', g.data_carona?'TRUE':'FALSE',
      g.retranca, g.modelo_clipping, g.tema, g.subtema, g.produto,
      g.obs, g.chave_subscore, g.cidade, g.estado,
      g.pontuacao, g.criterios, g.humano
    ]);

    const wsGab = XLSX.utils.aoa_to_sheet([hdrs,...gabRows]);

    // Pintar amarelo linhas que precisam revisão humana
    gabRows.forEach((r,i)=>{
      if (r[25]?.toString().trim()) {
        const addr = XLSX.utils.encode_cell({r:i+1, c:25});
        if (!wsGab[addr]) wsGab[addr]={v:r[25],t:'s'};
        wsGab[addr].s = {fill:{fgColor:{rgb:'FFEB9C'},patternType:'solid'}};
      }
    });

    // Negrito no header
    hdrs.forEach((_,c)=>{
      const addr = XLSX.utils.encode_cell({r:0,c});
      if (!wsGab[addr]) wsGab[addr]={v:hdrs[c],t:'s'};
      wsGab[addr].s = {font:{bold:true}, fill:{fgColor:{rgb:'FF6B35'},patternType:'solid'},
                       font:{bold:true,color:{rgb:'FFFFFF'}}};
    });

    XLSX.utils.book_append_sheet(wbOut, wsGab, 'Gabarito Dashboard');

    upd('Gerando Totais...', 92);

    // ── Aba Totais
    const EMP = ['Loft','QuintoAndar','ZAP','Superlógica'];
    const pts = {}, dests = {};
    EMP.forEach(e=>{pts[e]=0; dests[e]=[];});
    gabarito.forEach(g=>{
      if (g.protagonismo==='Destaque' && pts[g.empresa]!==undefined) {
        pts[g.empresa]+=(g.pontuacao||1); dests[g.empresa].push(g);
      }
    });
    const porMidia = {}, porEstado = {};
    gabarito.forEach(g=>{
      porMidia[g.tipo]=(porMidia[g.tipo]||0)+1;
      if (g.estado) porEstado[g.estado]=(porEstado[g.estado]||0)+1;
    });
    const nHumano = gabarito.filter(g=>g.humano?.trim()).length;

    const totData = [
      ['PR Score — Totais'], [''],
      ['PONTUAÇÃO POR EMPRESA','Pontos','Destaques'],
      ...EMP.map(e=>[e,pts[e],dests[e].length]),
      [''],
      ['TIPO DE MÍDIA','Qtd'],
      ...Object.entries(porMidia).sort((a,b)=>b[1]-a[1]),
      [''],
      ['ESTADO','Qtd'],
      ...Object.entries(porEstado).sort((a,b)=>b[1]-a[1]),
      [''],
      ['RESUMO',''],
      ['Total avaliadas', gabarito.length],
      ['Pintadas de vermelho', redReasons.length],
      ['Revisão humana pendente', nHumano],
    ];
    XLSX.utils.book_append_sheet(wbOut, XLSX.utils.aoa_to_sheet(totData), 'Totais');

    upd('Gerando outputs...', 96);

    // ── WhatsApp
    const hoje = new Date();
    const dd = `${String(hoje.getDate()).padStart(2,'0')}/${String(hoje.getMonth()+1).padStart(2,'0')}`;
    let wa = `📊 PR Score — ${dd}\n\n`;
    wa += `🟠 Loft: ${pts['Loft']} pts\n`;
    wa += `🔵 QuintoAndar: ${pts['QuintoAndar']} pts\n`;
    wa += `🟢 ZAP: ${pts['ZAP']} pts\n`;
    wa += `⚫ Superlógica: ${pts['Superlógica']} pts\n`;
    if (dests['Loft'].length>0) {
      wa += `\n📰 Destaques Loft do dia:\n`;
      dests['Loft'].forEach(d=>{ wa+=`• ${d.titulo} - ${d.veiculo} ${d.link}\n`; });
    }
    if (nHumano>0) wa+=`\n⚠️ ${nHumano} matéria${nHumano!==1?'s':''} aguardam revisão humana`;

    // ── HTML e-mail
    const CORES = {Loft:'#FF6B35',QuintoAndar:'#1A73E8',ZAP:'#34A853','Superlógica':'#212121'};
    const EMJS = {Loft:'🟠',QuintoAndar:'🔵',ZAP:'🟢','Superlógica':'⚫'};
    let secoes = '';
    for (const e of EMP) {
      const cor = CORES[e];
      const itens = dests[e].length===0
        ? '<p style="color:#888;font-style:italic">Sem destaques hoje.</p>'
        : dests[e].map(d=>`
          <div style="border-left:3px solid ${cor};padding:10px 16px;margin-bottom:10px;background:#fafafa">
            <a href="${d.link}" style="color:#111;font-weight:600;font-size:15px;text-decoration:none">${d.titulo}</a>
            <div style="margin-top:4px;font-size:13px;color:#666">
              ${d.veiculo} · ${d.data}
              <span style="background:${cor};color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;margin-left:6px">${d.pontuacao} pt${d.pontuacao!==1?'s':''}</span>
            </div>
          </div>`).join('');
      secoes += `<div style="margin-bottom:28px">
        <h2 style="color:${cor};border-bottom:2px solid ${cor};padding-bottom:6px">
          ${EMJS[e]} ${e} <span style="font-size:14px;font-weight:normal;color:#888">— ${pts[e]} pontos</span>
        </h2>${itens}</div>`;
    }

    const placar = EMP.map(e=>`
      <div style="text-align:center;padding:10px 16px">
        <div style="font-size:22px;font-weight:bold;color:${CORES[e]}">${pts[e]}</div>
        <div style="font-size:12px;color:#666">${e}</div>
      </div>`).join('');

    const htmlEmail = `<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PR Score — ${dd}</title></head>
<body style="font-family:Arial,sans-serif;max-width:660px;margin:0 auto;padding:24px;color:#222">
  <div style="background:#FF6B35;padding:20px 24px;border-radius:8px;margin-bottom:20px">
    <h1 style="color:#fff;margin:0;font-size:22px">📊 PR Score</h1>
    <p style="color:#fff;margin:4px 0 0;opacity:.9">${dd}</p>
  </div>
  <div style="display:flex;justify-content:space-around;background:#f5f5f5;border-radius:8px;margin-bottom:28px">${placar}</div>
  ${secoes}
  <div style="border-top:1px solid #eee;padding-top:14px;font-size:12px;color:#999;text-align:center">
    PR Score · Loft · Time de PR<br>
    <a href="#dashboard" style="color:#FF6B35">Ver histórico completo no Dashboard</a>
  </div>
</body></html>`;

    upd('Concluído! ✅', 100);

    const xlsxBuf = XLSX.write(wbOut, {bookType:'xlsx', type:'array', cellStyles:true});

    S.results = {
      xlsxBuf, wa, htmlEmail,
      stats: {
        total: rows.length, pintadas: redReasons.length,
        avaliadas: gabarito.length,
        destaques: gabarito.filter(g=>g.protagonismo==='Destaque').length,
        mencoes: gabarito.filter(g=>g.protagonismo==='Menção').length,
        humano: nHumano,
      }
    };
    S.processing = false;
    render();
  } catch(e) {
    S.processing = false;
    S.status = `❌ Erro: ${e.message}`;
    render();
  }
}

function upd(msg, pct) { S.status=msg; S.progress=pct; render(); }

function baixarXlsx() {
  if (!S.results) return;
  const blob = new Blob([S.results.xlsxBuf],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `PR_Score_${new Date().toISOString().slice(0,10)}.xlsx`;
  a.click();
}

function copiar(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const txt = el.tagName==='TEXTAREA' ? el.value : el.textContent;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='✅ Copiado!';
    setTimeout(()=>btn.textContent='📋 Copiar',2000);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = S.results ? renderResultados() : renderForm();
  bindEvents();
}

function renderForm() {

    <div style="background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:14px">

      <input id="apiKey" type="password" placeholder="AIzaSy..." value="${esc(S.apiKey)}"
        style="width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:14px;box-sizing:border-box"/>
      <p style="margin:5px 0 0;font-size:12px;color:#6b7280">

    <div style="background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:14px">
      <label style="display:block;font-weight:600;margin-bottom:7px;color:#374151;font-size:14px">📂 Planilha da Clipadora (.xlsx)</label>
      <div id="drop" style="border:2px dashed #d1d5db;border-radius:8px;padding:28px;text-align:center;cursor:pointer">
        <input type="file" id="fileInput" accept=".xlsx" style="display:none">
        ${S.file
          ? `<div style="font-size:28px">📄</div>
             <div style="font-weight:600;margin-top:6px">${esc(S.file.name)}</div>
             <div style="font-size:12px;color:#6b7280">${(S.file.size/1024).toFixed(0)} KB</div>
             <button id="rmFile" style="margin-top:6px;color:#ef4444;background:none;border:none;cursor:pointer;font-size:12px">✕ Remover</button>`
          : `<div style="font-size:28px">⬆️</div>
             <div style="margin:6px 0 3px;font-weight:500;color:#374151;font-size:14px">Arraste o arquivo aqui</div>
             <div style="font-size:13px;color:#6b7280">ou <span id="pickFile" style="color:#FF6B35;cursor:pointer;text-decoration:underline">clique para selecionar</span></div>`
        }
      </div>
    </div>

    ${S.processing ? `
    <div style="background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:7px">
        <span style="font-size:13px;color:#374151">${esc(S.status)}</span>
        <span style="font-size:13px;font-weight:700;color:#FF6B35">${S.progress}%</span>
      </div>
      <div style="background:#f3f4f6;border-radius:999px;height:9px;overflow:hidden">
        <div style="background:#FF6B35;height:100%;border-radius:999px;width:${S.progress}%" class="progress-fill"></div>
      </div>
    </div>` : ''}

    <button id="btnProcessar" ${ok?'':'disabled'}
      style="width:100%;padding:13px;font-size:15px;font-weight:700;color:white;border:none;border-radius:10px;
             cursor:${ok?'pointer':'not-allowed'};background:${ok?'#FF6B35':'#d1d5db'}">
      ${S.processing ? '⏳ Processando...' : '🚀 Processar PR Score'}
    </button>
    ${!S.apiKey ? '<p style="text-align:center;margin-top:7px;font-size:12px;color:#ef4444">Configure a chave API Gemini acima</p>' : ''}
  `;
}

  const s = S.results.stats;
  return `

    </div>

    <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:18px;margin-bottom:14px">
      <h3 style="margin:0 0 12px;color:#166534;font-size:15px">✅ Processamento concluído!</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center">
        <div><div style="font-size:20px;font-weight:700;color:#166534">${s.avaliadas}</div><div style="font-size:11px;color:#6b7280">Avaliadas</div></div>
        <div><div style="font-size:20px;font-weight:700;color:#FF6B35">${s.destaques}</div><div style="font-size:11px;color:#6b7280">Destaques</div></div>

        <div><div style="font-size:20px;font-weight:700;color:#dc2626">${s.pintadas}</div><div style="font-size:11px;color:#6b7280">Pintadas vermelho</div></div>
        <div><div style="font-size:20px;font-weight:700;color:#6b7280">${s.mencoes}</div><div style="font-size:11px;color:#6b7280">Menções</div></div>
      </div>
    </div>

    <div style="background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:14px">
      <h3 style="margin:0 0 8px;color:#374151;font-size:15px">📥 Planilha Processada</h3>
      <p style="margin:0 0 12px;font-size:12px;color:#6b7280">Abas: Cópia de Matérias · Matérias (linhas vermelhas) · Gabarito Dashboard · Totais</p>
      <button id="btnBaixar" style="background:#FF6B35;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px">

    <div style="background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:14px">

        <button id="cpWa" onclick="copiar('waText', this)" style="background:#25D366;color:white;border:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600">📋 Copiar</button>
      </div>
      <pre id="waText" style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;padding:12px;font-size:12px;line-height:1.7;margin:0">${esc(S.results.wa)}</pre>
    </div>

    <div style="background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:14px">

        <button id="cpHtml" onclick="copiar('htmlText', this)" style="background:#1A73E8;color:white;border:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600">📋 Copiar</button>

      <textarea id="htmlText" style="width:100%;height:140px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;padding:12px;font-size:11px;font-family:monospace;resize:vertical;box-sizing:border-box">${esc(S.results.htmlEmail)}</textarea>
    </div>

    <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:15px;margin-bottom:14px">
      <h4 style="margin:0 0 8px;color:#92400e;font-size:13px">📋 Próximos passos (ação humana):</h4>
      <ol style="margin:0;padding-left:18px;font-size:12px;color:#78350f;line-height:1.9">

    <button id="btnNova" style="width:100%;padding:10px;color:#6b7280;background:white;border:1px solid #d1d5db;border-radius:8px;cursor:pointer;font-size:13px">

function bindEvents() {
  const apiInput = document.getElementById('apiKey');
  if (apiInput) apiInput.addEventListener('input', e=>{ S.apiKey=e.target.value.trim(); sessionStorage.setItem('gk',S.apiKey); });

  const fi = document.getElementById('fileInput');
  if (fi) fi.addEventListener('change', e=>{ S.file=e.target.files[0]; render(); });

  const pick = document.getElementById('pickFile');
  if (pick) pick.addEventListener('click', ()=>document.getElementById('fileInput').click());

  const drop = document.getElementById('drop');
  if (drop) {
    drop.addEventListener('click', ()=>{ if (!S.file) document.getElementById('fileInput')?.click(); });
    drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('drop-active'); });
    drop.addEventListener('dragleave', ()=>drop.classList.remove('drop-active'));
    drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('drop-active'); S.file=e.dataTransfer.files[0]; render(); });
  }

  const rm = document.getElementById('rmFile');
  if (rm) rm.addEventListener('click', e=>{ e.stopPropagation(); S.file=null; render(); });

  const btnP = document.getElementById('btnProcessar');
  if (btnP) btnP.addEventListener('click', processar);

  const btnB = document.getElementById('btnBaixar');
  if (btnB) btnB.addEventListener('click', baixarXlsx);

  const btnN = document.getElementById('btnNova');
  if (btnN) btnN.addEventListener('click', ()=>{ S.results=null; S.file=null; render(); });
}

render();
</script>
